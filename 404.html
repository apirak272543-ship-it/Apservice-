<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0B8C7C" />
  <title>ไม่พบหน้านี้ · AP Service</title>
  <style>
    :root{--brand:#0b8c7c;--deep:#075e54;--ink:#142725;--muted:#60716f;--line:#dce9e7;--soft:#eef9f7}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 86% 10%,#c7f4eb,transparent 30%),linear-gradient(145deg,#f7fcfb,#eaf7f4);font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:var(--ink)}main{width:min(560px,100%);padding:30px;border:1px solid rgba(11,140,124,.16);border-radius:28px;background:rgba(255,255,255,.94);box-shadow:0 24px 60px rgba(5,89,79,.15);text-align:center}.icon{width:74px;height:74px;margin:auto;display:grid;place-items:center;border-radius:24px;background:var(--soft);color:var(--brand);font-size:34px}h1{font-size:clamp(25px,7vw,34px);letter-spacing:-1px;margin:19px 0 9px}p{margin:0 auto;color:var(--muted);max-width:420px;font-size:14px;line-height:1.7}.code{display:inline-flex;margin-top:14px;padding:6px 10px;border-radius:999px;background:#fff3dd;color:#9c6814;font-size:12px;font-weight:900}.actions{display:grid;gap:9px;margin-top:24px}.button{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;font-weight:900;font-size:14px;text-decoration:none;cursor:pointer;border:1px solid transparent}.primary{background:linear-gradient(135deg,var(--deep),var(--brand));color:#fff;box-shadow:0 10px 20px rgba(11,140,124,.2)}.secondary{background:#fff;border-color:var(--line);color:var(--ink)}.note{margin-top:19px;font-size:11px;color:var(--muted)}.note a{color:var(--brand);font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">↩</div>
    <div class="code">ข้อผิดพลาด 404</div>
    <h1>ไม่พบหน้าที่คุณกำลังหา</h1>
    <p>ลิงก์นี้อาจพิมพ์ไม่ครบ ย้ายตำแหน่ง หรือหมดอายุแล้ว คุณสามารถกลับไปหน้าก่อนหน้า หรือเริ่มต้นจากหน้า AP Service ได้ทันที</p>
    <div class="actions">
      <button class="button primary" type="button" onclick="goBack()">← กลับหน้าก่อนหน้า</button>
      <a class="button secondary" href="./index.html">กลับหน้าแรก AP Service</a>
    </div>
    <div class="note">หากพบปัญหาซ้ำ ให้กลับเข้าแอปและกด <a href="./index.html">“แจ้งปัญหา”</a> พร้อมภาพหน้าจอ</div>
  </main>
  <script>
    function goBack(){if(history.length>1)history.back();else location.assign('./index.html')}
  </script>
</body>
</html>
